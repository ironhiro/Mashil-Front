# 웹 CI
#   모든 push·PR: 타입 검사(tsc -b) + 빌드(vite build)
#   main push: 배포용 dist 를 아티팩트로 (서울남산체 생성 포함) + 백엔드에 web-updated 알림 → 개발 서버 반영
#              (토큰 BACK_DISPATCH_TOKEN 이 있을 때만. 이전 해시 에셋 7일 보존, OPS-04 — 백엔드 docs/OPERATIONS.md)
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Build
        run: npx vite build
      # 브라우저로 새는 값 검사: VITE_ 목록(src/vite-env.d.ts), import.meta.env 객체째 사용, 번들 속 비밀 모양 문자열
      - name: Env leak check
        run: node tool/check-env.mjs dist

  # 배포용 빌드. 글꼴은 라이선스상 저장소에 넣지 않으므로 여기서 만든다 (tool/make_fonts.py, seoul.go.kr 에서 받음)
  dist:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        run: |
          pip install fonttools brotli
          python tool/make_fonts.py
      - run: npm ci
      - name: Build
        env:
          # 저장소 Settings → Variables (Kakao JS 키는 브라우저에 공개되는 값이고 도메인으로 제한된다)
          VITE_KAKAO_MAP_KEY: ${{ vars.VITE_KAKAO_MAP_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
        run: npm run build
      # 실제 배포 값을 넣은 빌드로 다시 검사한다 (위 check 는 VITE_ 값 없이 빌드)
      - name: Env leak check
        run: node tool/check-env.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  # 백엔드에 알린다 → 백엔드 CI 가 이 main 으로 api 이미지를 다시 만들어 개발 서버에 올린다 (repository_dispatch: web-updated).
  # 시크릿 BACK_DISPATCH_TOKEN: Mashil-Back 한 저장소에만 Contents: Read and write 권한을 준 fine-grained PAT.
  # 시크릿이 없으면 건너뛴다 (그때는 백엔드 Actions 에서 ci 를 target=dev 로 직접 실행).
  notify-back:
    needs: dist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch web-updated
        env:
          GH_TOKEN: ${{ secrets.BACK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BACK_DISPATCH_TOKEN 이 없어 백엔드 배포를 건너뜁니다"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/Mashil-Back/dispatches" \
            -f event_type=web-updated -F "client_payload[web]=${GITHUB_SHA}"
