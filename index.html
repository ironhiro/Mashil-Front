<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#dde5ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- 서체: Overpass (라틴·숫자, @fontsource 로 직접 제공 — main.tsx) + 서울남산체 (한글, /fonts 에 직접 둠, tokens.css 의 @font-face).
         예전에는 Google Fonts CSS 를 불러 첫 화면을 약 0.9초 막았다 (Lighthouse render-blocking) -->
    <link rel="preload" href="/fonts/SeoulNamsanM.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>마실: 가까운 화장실 찾기</title>
    <meta name="description" content="지금 열린 가까운 공중화장실을 지도와 안내판으로 찾고, 카카오맵으로 길을 안내받아요." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
